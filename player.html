<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NexusID — Player</title>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Lexend+Deca:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2EDE4;
    --bg-panel: #E8E1D5;
    --bg-card: #EDE7DC;
    --border: #C9BFA8;
    --border-mid: #A89880;
    --forest: #2C4A2E;
    --olive: #4E7C2F;
    --orange: #C85E0A;
    --red: #9B1C11;
    --text-hero: #0C0A07;
    --text-body: #1C1A14;
    --text-dim: #6B6048;
    --radius-sm: 2px;
    --radius-md: 3px;
    --radius-lg: 4px;
    --font-display: 'Oswald', sans-serif;
    --font-body: 'Manrope', sans-serif;
    --font-mono: 'Lexend Deca', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text-body); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  a { text-decoration: none; }
  .tournament-card { position: relative; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--bg-card); overflow: hidden; transition: border-color .15s ease; }
  .tournament-card:hover { border-color: var(--border-mid); }
  .tournament-head { cursor: pointer; position: relative; min-height: 100px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; overflow: hidden; }
  .tournament-panel { max-height: 0; opacity: 0; overflow: hidden; transition: max-height .35s ease, opacity .25s ease; }
  .tournament-panel.open { max-height: 4000px; opacity: 1; }
  .chevron { transition: transform .25s ease; }
  .chevron.open { transform: rotate(180deg); }
</style></head>
<body>
<div style="width:100%;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text-body);font-family:var(--font-body);">

  <header style="flex-shrink:0;padding:clamp(24px,4vw,40px) clamp(20px,6vw,72px) clamp(16px,2vw,20px);display:flex;justify-content:center;">
    <div style="width:100%;max-width:560px;display:flex;align-items:center;gap:12px;">
      <a href="/search.html" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);background:var(--bg-card);border:1px solid var(--border);color:var(--text-dim);flex-shrink:0;">
        <iconify-icon icon="lucide:arrow-left" style="font-size:15px;"></iconify-icon>
      </a>
      <a href="/index.html" style="display:flex;align-items:center;gap:10px;">
        <div style="width:30px;height:30px;background:var(--orange);display:flex;align-items:center;justify-content:center;border-radius:var(--radius-lg);flex-shrink:0;">
          <iconify-icon icon="lucide:fingerprint" style="color:#fff;font-size:16px;"></iconify-icon>
        </div>
        <span style="font-family:var(--font-display);font-weight:600;letter-spacing:2px;font-size:19px;text-transform:uppercase;"><span style="color:var(--forest);">Nexus</span><span style="color:var(--orange);">ID</span></span>
      </a>
    </div>
  </header>

  <main id="content" style="flex:1;padding:clamp(4px,1vw,8px) clamp(20px,6vw,72px) clamp(48px,6vw,72px);display:flex;justify-content:center;">
    <div style="width:100%;max-width:560px;">
      <p style="font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.2em;color:var(--text-dim);">Loading…</p>
    </div>
  </main>

  <footer style="flex-shrink:0;padding:24px clamp(20px,6vw,72px) 34px;border-top:1px solid var(--border);display:flex;justify-content:center;">
    <p style="font-family:var(--font-mono);font-size:10px;color:rgba(107,96,72,.5);text-transform:uppercase;letter-spacing:0.2em;font-weight:500;margin:0;">Registry Infrastructure for Grassroots Esports</p>
  </footer>
</div>

<script type="module">
  import { supabase } from "/js/supabase-config.js";

  const content = document.getElementById("content");
  const nxId = new URLSearchParams(window.location.search).get("id") || "";

  const MAP_BG_VARIANTS = [
    { scale: 1.25, rotate: "-6deg", pos: "20% 30%" },
    { scale: 1.5, rotate: "5deg", pos: "80% 70%" },
    { scale: 1.35, rotate: "-3.5deg", pos: "50% 15%" },
    { scale: 1.6, rotate: "7deg", pos: "15% 80%" },
    { scale: 1.42, rotate: "-8deg", pos: "75% 35%" },
  ];

  function mapImage(mapName) {
    const key = (mapName || "").toLowerCase();
    if (key.includes("mira")) return "/assets/maps/miramar_mid.jpg";
    if (key.includes("san")) return "/assets/maps/sanhok_mid.jpg";
    if (key.includes("rondo")) return "/assets/maps/rondo_mid.jpg";
    return "/assets/maps/erangel_mid.jpg";
  }

  function placeColor(p) {
    if (p === 1) return "var(--olive)";
    if (p !== null && p <= 5) return "#fff";
    return "rgba(255,255,255,.7)";
  }

  function wrap(inner) {
    content.innerHTML = `<div style="width:100%;max-width:560px;">${inner}</div>`;
  }

  function notFound() {
    wrap(`
      <div style="padding-top:40px;display:flex;flex-direction:column;gap:8px;">
        <h1 style="font-family:var(--font-display);font-weight:700;font-size:26px;color:var(--text-hero);margin:0;">Not Found</h1>
        <p style="font-size:14px;color:var(--text-dim);margin:0;">No Nexus ID matches "${nxId}".</p>
        <a href="/search.html" style="margin-top:8px;font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--forest);text-transform:uppercase;letter-spacing:0.1em;">&larr; Back to search</a>
      </div>`);
  }

  async function render() {
    if (!nxId) { notFound(); return; }

    const { data: player, error } = await supabase
      .from("nexus_players")
      .select("id, nx_id, real_name, claimed, created_at")
      .eq("nx_id", nxId)
      .maybeSingle();

    if (error || !player) { notFound(); return; }

    const [{ data: accounts }, { data: memberships }, { data: participations }] = await Promise.all([
      supabase.from("nexus_player_game_accounts")
        .select("game, in_game_name, in_game_uid, created_at")
        .eq("player_id", player.id)
        .order("created_at", { ascending: false }),
      supabase.from("nexus_team_members")
        .select("joined_at, nexus_teams(team_name)")
        .eq("player_id", player.id)
        .is("left_at", null)
        .order("joined_at", { ascending: false }),
      supabase.from("nexus_participations")
        .select("match_id, team_id, placement, kills, nexus_matches(tournament_id, map, played_at, nexus_tournaments(name, game, stage))")
        .eq("player_id", player.id),
    ]);

    const accountList = accounts || [];
    const primaryAccount = accountList[0] || null;
    const accountExtra = Math.max(accountList.length - 1, 0);

    const membershipList = (memberships || []).filter((m) => m.nexus_teams);
    const primaryTeam = membershipList[0]?.nexus_teams || null;
    const teamExtra = Math.max(membershipList.length - 1, 0);

    const rows = (participations || []).filter((p) => p.nexus_matches);
    const matchIds = [...new Set(rows.map((p) => p.match_id))];

    let squadKillsMap = new Map();
    if (matchIds.length) {
      const { data: squadRows } = await supabase
        .from("nexus_match_squad_kills")
        .select("match_id, team_id, squad_kills")
        .in("match_id", matchIds);
      squadKillsMap = new Map((squadRows || []).map((r) => [`${r.match_id}:${r.team_id}`, r.squad_kills]));
    }

    // --- Stat row (across all of the player's matches) ---
    const totalMatches = rows.length;
    const placements = rows.map((p) => p.placement).filter((x) => x !== null && x !== undefined);
    const avgPlace = placements.length ? Math.round(placements.reduce((a, b) => a + b, 0) / placements.length) : null;
    const totalKills = rows.reduce((a, p) => a + (p.kills || 0), 0);
    const wins = rows.filter((p) => p.placement === 1).length;
    const winRate = totalMatches ? Math.round((wins / totalMatches) * 100) : 0;

    // --- Group into tournaments -> days -> matches ---
    const tournamentsMap = new Map();
    rows.forEach((p) => {
      const m = p.nexus_matches;
      const t = m.nexus_tournaments;
      const tid = m.tournament_id;
      if (!tournamentsMap.has(tid)) {
        tournamentsMap.set(tid, {
          id: tid,
          name: t?.name || "Unknown Tournament",
          game: t?.game || "",
          stage: t?.stage || null,
          latest: m.played_at || "",
          days: new Map(),
        });
      }
      const tour = tournamentsMap.get(tid);
      if ((m.played_at || "") > tour.latest) tour.latest = m.played_at || tour.latest;
      const dayKey = m.played_at ? m.played_at.slice(0, 10) : "unscheduled";
      if (!tour.days.has(dayKey)) tour.days.set(dayKey, []);
      const squadKills = p.team_id ? (squadKillsMap.get(`${p.match_id}:${p.team_id}`) ?? p.kills) : p.kills;
      tour.days.get(dayKey).push({
        map: m.map || "Unknown",
        placement: p.placement,
        kills: p.kills,
        squadKills,
      });
    });

    const tournaments = Array.from(tournamentsMap.values())
      .sort((a, b) => (b.latest || "").localeCompare(a.latest || ""))
      .map((t, ti) => {
        const allMatches = Array.from(t.days.values()).flat();
        const placementsInT = allMatches.map((m) => m.placement).filter((x) => x !== null && x !== undefined);
        const bestPlace = placementsInT.length ? String(Math.min(...placementsInT)).padStart(2, "0") : "—";
        const days = Array.from(t.days.entries())
          .sort((a, b) => a[0].localeCompare(b[0]))
          .map(([key, matches], di) => ({
            label: key === "unscheduled" ? "Unscheduled" : `Day ${di + 1}`,
            date: key === "unscheduled" ? "" : new Date(key).toLocaleDateString(undefined, { month: "short", day: "numeric" }),
            matches,
          }));
        return { ...t, bestPlace, dayCount: days.length, matchCount: allMatches.length, days, bg: MAP_BG_VARIANTS[ti % MAP_BG_VARIANTS.length] };
      });

    // --- Render ---
    const claimedBadge = player.claimed
      ? `<div style="display:flex;align-items:center;gap:6px;flex-shrink:0;padding:6px 10px;border-radius:var(--radius-sm);background:var(--bg-panel);border:1px solid var(--border);">
           <iconify-icon icon="lucide:shield-check" style="color:var(--olive);font-size:13px;"></iconify-icon>
           <span style="font-family:var(--font-mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--olive);">Claimed</span>
         </div>`
      : `<div style="display:flex;align-items:center;gap:6px;flex-shrink:0;padding:6px 10px;border-radius:var(--radius-sm);background:var(--bg-panel);border:1px solid var(--border);">
           <span style="width:6px;height:6px;border-radius:50%;background:var(--red);display:block;"></span>
           <span style="font-family:var(--font-mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--red);">Unclaimed</span>
         </div>`;

    const accountLine = primaryAccount
      ? `<div style="display:flex;align-items:center;gap:10px;padding-top:12px;">
           <iconify-icon icon="lucide:gamepad-2" style="color:var(--text-dim);font-size:15px;flex-shrink:0;"></iconify-icon>
           <span style="font-size:15px;font-weight:700;color:var(--text-hero);">${primaryAccount.in_game_name}</span>
           <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:0.05em;">${primaryAccount.game} · UID ${primaryAccount.in_game_uid}</span>
           ${accountExtra ? `<span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);">+${accountExtra} more</span>` : ""}
         </div>`
      : `<div style="display:flex;align-items:center;gap:10px;padding-top:12px;">
           <iconify-icon icon="lucide:gamepad-2" style="color:var(--text-dim);font-size:15px;flex-shrink:0;"></iconify-icon>
           <span style="font-size:13px;color:var(--text-dim);">No linked game accounts.</span>
         </div>`;

    const teamLine = primaryTeam
      ? `<div style="display:flex;align-items:center;gap:10px;">
           <iconify-icon icon="lucide:users" style="color:var(--text-dim);font-size:15px;flex-shrink:0;"></iconify-icon>
           <span style="font-size:13px;color:var(--text-body);">${primaryTeam.team_name}</span>
           ${teamExtra ? `<span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);">+${teamExtra} more</span>` : ""}
         </div>`
      : `<div style="display:flex;align-items:center;gap:10px;">
           <iconify-icon icon="lucide:users" style="color:var(--text-dim);font-size:15px;flex-shrink:0;"></iconify-icon>
           <span style="font-size:13px;color:var(--text-dim);">No active team.</span>
         </div>`;

    const stats = [
      { label: "Matches", value: totalMatches },
      { label: "Avg Place", value: avgPlace !== null ? `#${avgPlace}` : "—" },
      { label: "Total Kills", value: totalKills },
      { label: "Win Rate", value: `${winRate}%` },
    ];
    const statsHtml = stats.map((s, i) => `
      <div style="border-top:1px solid var(--border);border-left:${i === 0 ? "none" : "1px solid var(--border)"};padding:16px 20px 20px;display:flex;flex-direction:column;gap:10px;">
        <span style="font-family:var(--font-mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-dim);line-height:1.3;">${s.label}</span>
        <span style="font-family:var(--font-display);font-weight:700;font-size:clamp(1.7rem,2vw + 1.2rem,2.1rem);color:var(--forest);line-height:1;">${s.value}</span>
      </div>`).join("");

    const tournamentsHtml = tournaments.length
      ? tournaments.map((t) => `
        <div class="tournament-card" style="margin-bottom:14px;">
          <div class="tournament-head" data-toggle="t-${t.id}">
            <div style="position:absolute;inset:0;background-image:url('${mapImage(t.days[0]?.matches[0]?.map)}');background-size:cover;background-position:${t.bg.pos};filter:blur(3.2px);transform:scale(${t.bg.scale}) rotate(${t.bg.rotate});"></div>
            <div style="position:absolute;inset:0;background:linear-gradient(90deg, rgba(20,17,13,.92) 0%, rgba(20,17,13,.68) 55%, rgba(20,17,13,.3) 100%);"></div>
            <div style="position:relative;display:flex;flex-direction:column;gap:4px;min-width:0;">
              <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-family:var(--font-mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:var(--orange);">Best Placement #${t.bestPlace}</span>
                ${t.stage ? `<span style="font-family:var(--font-mono);font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#fff;background:rgba(255,255,255,.15);padding:2px 6px;border-radius:var(--radius-sm);">${t.stage}</span>` : ""}
              </div>
              <span style="font-family:var(--font-body);font-weight:800;font-size:18px;color:#fff;line-height:1.25;letter-spacing:0.01em;">${t.name}</span>
              <span style="font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:rgba(255,255,255,.75);">${t.game}</span>
              <span style="font-family:var(--font-mono);font-size:9px;font-weight:700;color:rgba(255,255,255,.85);">${t.dayCount} Day${t.dayCount === 1 ? "" : "s"} · ${t.matchCount} Match${t.matchCount === 1 ? "" : "es"}</span>
            </div>
            <iconify-icon class="chevron" data-chevron="t-${t.id}" icon="lucide:chevron-down" style="position:relative;color:rgba(255,255,255,.9);font-size:18px;flex-shrink:0;"></iconify-icon>
          </div>
          <div class="tournament-panel" data-panel="t-${t.id}">
            <div style="display:flex;flex-direction:column;gap:14px;padding:16px;background:var(--bg-panel);border-top:1px solid var(--border);">
              ${t.days.map((d) => `
                <div style="display:flex;flex-direction:column;gap:8px;">
                  <div style="display:flex;align-items:baseline;gap:8px;">
                    <span style="font-family:var(--font-display);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-hero);">${d.label}</span>
                    ${d.date ? `<span style="font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);">${d.date}</span>` : ""}
                  </div>
                  <div style="display:flex;flex-direction:column;gap:6px;">
                    ${d.matches.map((m) => `
                      <div style="border-radius:var(--radius-md);border:1px solid var(--border);overflow:hidden;position:relative;min-height:64px;background-image:linear-gradient(100deg, rgba(15,13,10,.94) 0%, rgba(15,13,10,.82) 60%, rgba(15,13,10,.62) 100%), url('${mapImage(m.map)}');background-size:cover;background-position:center;display:flex;align-items:center;gap:10px;padding:10px 12px;">
                        <div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;">
                          <span style="font-size:13px;font-weight:700;color:#fff;">${m.map}</span>
                          <span style="font-family:var(--font-mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#F4A662;">Squad Kills: ${m.squadKills}</span>
                        </div>
                        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;background:rgba(20,17,13,.55);border:1px solid rgba(255,255,255,.18);border-radius:var(--radius-sm);padding:5px 10px;">
                          <div style="display:flex;flex-direction:column;align-items:center;min-width:26px;">
                            <span style="font-family:var(--font-display);font-weight:700;font-size:15px;color:${placeColor(m.placement)};line-height:1;">${m.placement !== null && m.placement !== undefined ? "#" + m.placement : "—"}</span>
                            <span style="font-family:var(--font-mono);font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:rgba(255,255,255,.75);">Place</span>
                          </div>
                          <div style="width:1px;height:22px;background:rgba(255,255,255,.25);"></div>
                          <div style="display:flex;flex-direction:column;align-items:center;min-width:22px;">
                            <span style="font-family:var(--font-display);font-weight:700;font-size:15px;color:#fff;line-height:1;">${m.kills}</span>
                            <span style="font-family:var(--font-mono);font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:rgba(255,255,255,.75);">Kills</span>
                          </div>
                        </div>
                      </div>`).join("")}
                  </div>
                </div>`).join("")}
            </div>
          </div>
        </div>`).join("")
      : `<p style="font-size:13px;color:var(--text-dim);">No tournament history yet.</p>`;

    wrap(`
      <div style="display:flex;flex-direction:column;gap:clamp(20px,2.6vw,28px);">
        <div style="padding:clamp(20px,2.6vw,26px);border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--bg-card);display:flex;flex-direction:column;gap:14px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
            <div style="display:flex;flex-direction:column;gap:2px;">
              <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.2em;color:var(--text-dim);">Nexus ID</span>
              <h1 style="font-family:var(--font-display);font-weight:700;font-size:clamp(1.8rem,2vw + 1.4rem,2.4rem);color:var(--text-hero);margin:0;line-height:1;">${player.nx_id}</h1>
              ${player.real_name ? `<p style="font-size:13px;color:var(--text-dim);margin:2px 0 0;">${player.real_name}</p>` : ""}
            </div>
            ${claimedBadge}
          </div>

          <div style="display:flex;flex-direction:column;gap:8px;padding-top:4px;border-top:1px solid var(--border);">
            ${accountLine}
            ${teamLine}
          </div>

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin:8px calc(-1 * clamp(20px,2.6vw,26px)) calc(-1 * clamp(20px,2.6vw,26px));">
            ${statsHtml}
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:12px;">
          <p style="font-family:var(--font-mono);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.16em;color:var(--olive);margin:0;">Tournament History</p>
          <div>${tournamentsHtml}</div>
        </div>
      </div>`);

    content.querySelectorAll("[data-toggle]").forEach((head) => {
      head.addEventListener("click", () => {
        const key = head.getAttribute("data-toggle");
        content.querySelector(`[data-panel="${key}"]`).classList.toggle("open");
        content.querySelector(`[data-chevron="${key}"]`).classList.toggle("open");
      });
    });
  }

  render();
</script>
</body></html>
