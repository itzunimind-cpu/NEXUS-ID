<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NexusID — Player</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Lexend+Deca:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
  body { font-family: 'Manrope', sans-serif; background-color: #F2EDE4; color: #1C1A14; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Oswald', sans-serif; }
  .font-mono { font-family: 'Lexend Deca', sans-serif; }
</style></head>
<body>
<div class="w-full min-h-screen flex flex-col bg-[#F2EDE4]">

  <header class="shrink-0 pt-14 px-6 pb-4 bg-[#F2EDE4]">
    <a href="/index.html" class="flex items-center gap-2 w-fit">
      <div class="w-8 h-8 bg-[#C85E0A] flex items-center justify-center rounded"><span class="text-white font-bold text-lg leading-none">N</span></div>
      <span class="font-display font-bold tracking-tighter text-xl uppercase italic text-[#0C0A07]">NexusID</span>
    </a>
  </header>

  <main id="content" class="flex-1 px-6 py-4">
    <p class="font-mono text-xs text-[#6B6048] uppercase tracking-widest">Loading…</p>
  </main>

  <footer class="shrink-0 pb-[34px] px-6 pt-6 bg-[#F2EDE4] border-t border-[#C9BFA8]/50">
    <p class="font-mono text-[10px] text-[#6B6048]/50 uppercase tracking-[0.2em] font-medium text-center">Registry Infrastructure for Grassroots Esports</p>
  </footer>
</div>

<script type="module">
  import { supabase } from "/js/supabase-config.js";

  const content = document.getElementById("content");
  const nxId = new URLSearchParams(window.location.search).get("id") || "";

  function notFound() {
    content.innerHTML = `
      <div class="pt-10 space-y-2">
        <h1 class="text-2xl font-display font-bold text-[#0C0A07]">Not Found</h1>
        <p class="text-sm text-[#6B6048]">No Nexus ID matches "${nxId}".</p>
        <a href="/index.html" class="inline-block mt-4 font-mono text-xs font-bold text-[#2C4A2E] uppercase tracking-widest">&larr; Back to search</a>
      </div>`;
  }

  async function render() {
    if (!nxId) { notFound(); return; }

    const { data: player, error } = await supabase
      .from("nexus_players")
      .select("id, nx_id, real_name, claimed, created_at")
      .eq("nx_id", nxId)
      .maybeSingle();

    if (error || !player) { notFound(); return; }

    const [{ data: accounts }, { data: summaries }] = await Promise.all([
      supabase.from("nexus_player_game_accounts").select("game, in_game_name, in_game_uid").eq("player_id", player.id),
      supabase.from("nexus_player_tournament_summary").select("tournament_id, matches_played, total_kills, best_placement").eq("player_id", player.id),
    ]);

    let tournamentNames = {};
    if (summaries && summaries.length) {
      const ids = summaries.map((s) => s.tournament_id);
      const { data: tournaments } = await supabase.from("nexus_tournaments").select("id, name, game").in("id", ids);
      (tournaments || []).forEach((t) => { tournamentNames[t.id] = t; });
    }

    const claimedBadge = player.claimed
      ? `<span class="font-mono text-[10px] font-bold uppercase tracking-widest px-2.5 py-1 rounded bg-[#2C4A2E]/10 text-[#2C4A2E] border border-[#2C4A2E]/25">Claimed</span>`
      : `<span class="font-mono text-[10px] font-bold uppercase tracking-widest px-2.5 py-1 rounded bg-[#C85E0A]/10 text-[#C85E0A] border border-[#C85E0A]/40">Account Unclaimed</span>`;

    const accountsHtml = (accounts && accounts.length)
      ? accounts.map((a) => `
        <div class="flex justify-between items-center py-3 border-b border-[#C9BFA8]/30 last:border-0">
          <div>
            <p class="text-sm text-[#1C1A14] font-medium">${a.in_game_name}</p>
            <p class="font-mono text-[10px] text-[#6B6048] uppercase tracking-widest mt-0.5">${a.game}</p>
          </div>
          <p class="font-mono text-[10px] text-[#6B6048]/70">${a.in_game_uid}</p>
        </div>`).join("")
      : `<p class="text-xs text-[#6B6048]">No linked game accounts.</p>`;

    const historyHtml = (summaries && summaries.length)
      ? summaries.map((s) => {
          const t = tournamentNames[s.tournament_id];
          return `
          <div class="p-4 rounded-xl bg-[#E8E1D5] border border-[#C9BFA8]/60">
            <div class="flex justify-between items-start mb-2">
              <p class="text-sm font-display font-bold text-[#0C0A07]">${t ? t.name : "Unknown Tournament"}</p>
              ${t ? `<span class="font-mono text-[9px] font-bold uppercase tracking-widest text-[#6B6048]">${t.game}</span>` : ""}
            </div>
            <div class="flex gap-4">
              <p class="text-xs text-[#6B6048]"><span class="font-mono font-bold text-[#2C4A2E]">${s.matches_played}</span> matches</p>
              <p class="text-xs text-[#6B6048]"><span class="font-mono font-bold text-[#2C4A2E]">${s.total_kills}</span> kills</p>
              ${s.best_placement ? `<p class="text-xs text-[#6B6048]">Best <span class="font-mono font-bold text-[#2C4A2E]">#${s.best_placement}</span></p>` : ""}
            </div>
          </div>`;
        }).join("")
      : `<p class="text-xs text-[#6B6048]">No tournament history yet.</p>`;

    content.innerHTML = `
      <div class="pt-4 pb-8 space-y-3">
        <div class="flex items-center justify-between">
          <h1 class="text-3xl font-display font-bold text-[#0C0A07] tracking-tight">${player.nx_id}</h1>
          ${claimedBadge}
        </div>
        ${player.real_name ? `<p class="text-sm text-[#1C1A14]/80">${player.real_name}</p>` : ""}
        <p class="font-mono text-[10px] text-[#6B6048]/60 uppercase tracking-widest">Registered ${new Date(player.created_at).toLocaleDateString()}</p>
      </div>

      <div class="space-y-3 pb-8">
        <p class="font-mono text-[10px] font-bold uppercase tracking-widest text-[#4E7C2F]/80">In-Game Accounts</p>
        <div class="p-4 rounded-2xl bg-[#EDE7DC] border border-[#C9BFA8]/40">${accountsHtml}</div>
      </div>

      <div class="space-y-3 pb-8">
        <p class="font-mono text-[10px] font-bold uppercase tracking-widest text-[#4E7C2F]/80">Tournament History</p>
        <div class="space-y-3">${historyHtml}</div>
      </div>
    `;
  }

  render();
</script>
</body></html>
