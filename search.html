<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NexusID — Search the Registry</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Lexend+Deca:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
  body { font-family: 'Manrope', sans-serif; background-color: #F2EDE4; color: #1C1A14; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Oswald', sans-serif; }
  .font-mono { font-family: 'Lexend Deca', sans-serif; }
</style></head>
<body>
<div class="w-full min-h-screen flex flex-col bg-[#F2EDE4]">

  <header class="shrink-0 pt-14 px-6 pb-4 bg-[#F2EDE4]">
    <div class="flex items-center gap-3 mb-6">
      <a href="/index.html" class="w-8 h-8 flex items-center justify-center rounded-lg bg-[#E8E1D5] border border-[#C9BFA8]/60 text-[#6B6048]">&larr;</a>
      <a href="/index.html" class="flex items-center gap-2">
        <div class="w-8 h-8 bg-[#C85E0A] flex items-center justify-center rounded"><span class="text-white font-bold text-lg leading-none">N</span></div>
        <span class="font-display font-bold tracking-tighter text-xl uppercase italic text-[#0C0A07]">NexusID</span>
      </a>
    </div>
    <div class="space-y-1">
      <h1 class="text-2xl font-display font-bold tracking-tight text-[#0C0A07]">Search the Registry</h1>
      <p class="text-sm text-[#6B6048] font-medium tracking-wide">Find a player by Nexus ID or in-game name</p>
    </div>
  </header>

  <main class="flex-1 px-6 py-4">

    <section class="pb-6 space-y-3">
      <div class="relative flex items-center rounded-xl bg-[#E8E1D5] border border-[#C9BFA8]/60 focus-within:border-[#A89880] transition-colors">
        <input type="text" id="search-input" placeholder="Search by Nexus ID or IGN" autocomplete="off" autofocus
          class="w-full bg-transparent py-3.5 px-4 text-sm text-[#1C1A14] placeholder:text-[#6B6048]/50 outline-none">
      </div>
      <p id="search-hint" class="font-mono text-[10px] text-[#6B6048]/60 uppercase tracking-widest pl-1">Type at least 2 characters</p>
      <div id="search-results" class="space-y-2 hidden"></div>
    </section>

  </main>

  <footer class="shrink-0 pb-[34px] px-6 pt-6 bg-[#F2EDE4] border-t border-[#C9BFA8]/50">
    <p class="font-mono text-[10px] text-[#6B6048]/50 uppercase tracking-[0.2em] font-medium text-center">Registry Infrastructure for Grassroots Esports</p>
  </footer>
</div>

<script type="module">
  import { supabase } from "/js/supabase-config.js";

  const searchInput = document.getElementById("search-input");
  const searchHint = document.getElementById("search-hint");
  const searchResults = document.getElementById("search-results");
  let debounceTimer;

  function resultRow({ nx_id, real_name, claimed, matched_ign }) {
    const label = matched_ign || real_name || "";
    const unclaimedDot = claimed
      ? ""
      : `<span class="w-1.5 h-1.5 rounded-full bg-[#B3261E]"></span><span class="font-mono text-[10px] font-bold text-[#B3261E] uppercase">Unclaimed</span>`;
    return `
      <a href="/player.html?id=${encodeURIComponent(nx_id)}" class="block p-4 rounded-xl border border-[#C9BFA8]/30 bg-[#EDE7DC]/60 active:bg-[#E8E1D5] transition-colors">
        <div class="flex justify-between items-start">
          <div>
            <h3 class="text-lg font-display font-bold text-[#0C0A07] leading-none mb-1">${nx_id}</h3>
            ${label ? `<p class="text-xs text-[#6B6048] font-medium">${label}</p>` : ""}
          </div>
          <div class="flex items-center gap-1">${unclaimedDot}</div>
        </div>
      </a>`;
  }

  async function runSearch(q) {
    const [byId, byIgn] = await Promise.all([
      supabase.from("nexus_players").select("nx_id, real_name, claimed").ilike("nx_id", `%${q}%`).limit(8),
      supabase.from("nexus_player_game_accounts")
        .select("in_game_name, nexus_players(nx_id, real_name, claimed)")
        .ilike("in_game_name", `%${q}%`).limit(8),
    ]);

    const merged = new Map();
    (byId.data || []).forEach((p) => merged.set(p.nx_id, { ...p }));
    (byIgn.data || []).forEach((row) => {
      const p = row.nexus_players;
      if (!p) return;
      const existing = merged.get(p.nx_id) || { ...p };
      merged.set(p.nx_id, { ...existing, matched_ign: row.in_game_name });
    });

    const results = Array.from(merged.values());
    if (byId.error && byIgn.error) {
      searchResults.innerHTML = `<p class="text-xs text-[#B3261E]">Search failed. Try again.</p>`;
    } else if (results.length === 0) {
      searchResults.innerHTML = `<p class="text-xs text-[#6B6048]">No matches for "${q}".</p>`;
    } else {
      searchResults.innerHTML = results.map(resultRow).join("");
    }
    searchResults.classList.remove("hidden");
    searchHint.classList.add("hidden");
  }

  searchInput.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    const q = searchInput.value.trim();
    if (q.length < 2) {
      searchResults.classList.add("hidden");
      searchResults.innerHTML = "";
      searchHint.classList.remove("hidden");
      return;
    }
    debounceTimer = setTimeout(() => runSearch(q), 300);
  });
</script>
</body></html>
