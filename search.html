<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NexusID — Search the Registry</title>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Lexend+Deca:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2EDE4;
    --bg-card: #EDE7DC;
    --border: #C9BFA8;
    --border-mid: #A89880;
    --forest: #2C4A2E;
    --orange: #C85E0A;
    --red: #9B1C11;
    --text-hero: #0C0A07;
    --text-body: #1C1A14;
    --text-dim: #6B6048;
    --radius-md: 3px;
    --radius-lg: 4px;
    --font-display: 'Oswald', sans-serif;
    --font-body: 'Manrope', sans-serif;
    --font-mono: 'Lexend Deca', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text-body); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  a { text-decoration: none; }
  input:focus { outline: none; border-color: var(--forest) !important; }
  .search-input { width: 100%; padding: 12px 14px 12px 32px; background: var(--bg); color: var(--text-body); border: 1px solid var(--border-mid); border-radius: var(--radius-md); font-family: var(--font-body); font-size: 14px; transition: border-color .2s; }
  .status-text { font-family: var(--font-mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-dim); margin: 0; padding-left: 4px; }
  .result-card { display: block; padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--bg-card); transition: border-color .15s ease, box-shadow .15s ease; }
  .result-card:hover { border-color: var(--border-mid); box-shadow: 0 4px 16px rgba(13,13,13,.08); }
</style></head>
<body>
<div style="width:100%;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text-body);font-family:var(--font-body);">

  <header style="flex-shrink:0;padding:clamp(24px,4vw,40px) clamp(20px,6vw,72px) clamp(16px,2vw,20px);display:flex;justify-content:center;">
    <div style="width:100%;max-width:480px;display:flex;flex-direction:column;gap:20px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <a href="/index.html" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);background:var(--bg-card);border:1px solid var(--border);color:var(--text-dim);flex-shrink:0;">
          <iconify-icon icon="lucide:arrow-left" style="font-size:15px;"></iconify-icon>
        </a>
        <a href="/index.html" style="display:flex;align-items:center;gap:10px;">
          <div style="width:30px;height:30px;background:var(--orange);display:flex;align-items:center;justify-content:center;border-radius:var(--radius-lg);flex-shrink:0;">
            <iconify-icon icon="lucide:fingerprint" style="color:#fff;font-size:16px;"></iconify-icon>
          </div>
          <span style="font-family:var(--font-display);font-weight:600;letter-spacing:2px;font-size:19px;text-transform:uppercase;"><span style="color:var(--forest);">Nexus</span><span style="color:var(--orange);">ID</span></span>
        </a>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;">
        <h1 style="font-family:var(--font-display);font-weight:700;letter-spacing:-0.01em;font-size:clamp(1.5rem,2vw + 1.1rem,1.9rem);color:var(--text-hero);margin:0;">Search the Registry</h1>
        <p style="font-size:13px;color:var(--text-dim);font-weight:500;margin:0;">Find a player, organizer, or team by ID or name</p>
      </div>
    </div>
  </header>

  <main style="flex:1;padding:clamp(8px,1vw,12px) clamp(20px,6vw,72px) clamp(32px,4vw,44px);display:flex;justify-content:center;">
    <div style="width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px;">

      <div style="position:relative;">
        <iconify-icon icon="lucide:search" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:15px;pointer-events:none;"></iconify-icon>
        <input type="text" id="search-input" placeholder="Search by NX-, TO-, TM- ID, IGN, or name" autocomplete="off" autofocus class="search-input">
      </div>

      <p id="search-hint" class="status-text">Type at least 2 characters</p>
      <p id="search-loading" class="status-text" hidden>Searching…</p>
      <p id="search-error" style="font-size:12px;color:var(--red);font-weight:500;margin:0;padding-left:4px;" hidden>Search failed. Try again.</p>
      <p id="search-empty" style="font-size:12px;color:var(--text-dim);margin:0;padding-left:4px;" hidden></p>
      <div id="search-results" style="display:flex;flex-direction:column;gap:8px;" hidden></div>

    </div>
  </main>
</div>

<script type="module">
  import { supabase } from "/js/supabase-config.js";

  const searchInput = document.getElementById("search-input");
  const hintEl = document.getElementById("search-hint");
  const loadingEl = document.getElementById("search-loading");
  const errorEl = document.getElementById("search-error");
  const emptyEl = document.getElementById("search-empty");
  const resultsEl = document.getElementById("search-results");
  let debounceTimer;

  function setStatus(status, query) {
    hintEl.hidden = status !== "idle";
    loadingEl.hidden = status !== "loading";
    errorEl.hidden = status !== "error";
    emptyEl.hidden = status !== "empty";
    resultsEl.hidden = status !== "results";
    if (status === "empty") emptyEl.textContent = `No matches for "${query}".`;
  }

  const TYPE_META = {
    player: { href: "/player.html", badge: "Player", color: "var(--forest)" },
    to: { href: "/to.html", badge: "Organizer", color: "var(--forest)" },
    team: { href: "/team.html", badge: "Team", color: "var(--orange)" },
  };

  function resultCard({ type, id_code, label, unclaimed }) {
    const meta = TYPE_META[type];
    const unclaimedBadge = unclaimed
      ? `<div style="display:flex;align-items:center;gap:6px;flex-shrink:0;padding-top:2px;">
           <span style="width:6px;height:6px;border-radius:50%;background:var(--red);display:block;"></span>
           <span style="font-family:var(--font-mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--red);">Unclaimed</span>
         </div>`
      : `<span style="font-family:var(--font-mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:${meta.color};flex-shrink:0;padding-top:2px;">${meta.badge}</span>`;
    return `
      <a href="${meta.href}?id=${encodeURIComponent(id_code)}" class="result-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
          <div style="display:flex;flex-direction:column;gap:4px;">
            <h3 style="font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--text-hero);margin:0;line-height:1;">${id_code}</h3>
            ${label ? `<p style="font-size:12px;color:var(--text-dim);font-weight:500;margin:0;">${label}</p>` : ""}
          </div>
          ${unclaimedBadge}
        </div>
      </a>`;
  }

  async function runSearch(q) {
    const [byId, byIgn, byTo, byTeam] = await Promise.all([
      supabase.from("nexus_players").select("nx_id, real_name, claimed").ilike("nx_id", `%${q}%`).limit(8),
      supabase.from("nexus_player_game_accounts")
        .select("in_game_name, nexus_players(nx_id, real_name, claimed)")
        .ilike("in_game_name", `%${q}%`).limit(8),
      supabase.from("nexus_tos")
        .select("to_id, to_ign, organisation_name")
        .or(`to_id.ilike.%${q}%,to_ign.ilike.%${q}%,organisation_name.ilike.%${q}%`).limit(8),
      supabase.from("nexus_teams")
        .select("tm_id, team_name")
        .or(`tm_id.ilike.%${q}%,team_name.ilike.%${q}%`).limit(8),
    ]);

    if (byId.error && byIgn.error && byTo.error && byTeam.error) {
      setStatus("error");
      return;
    }

    const merged = new Map();
    (byId.data || []).forEach((p) => merged.set(p.nx_id, {
      type: "player", id_code: p.nx_id, label: p.real_name || "", unclaimed: !p.claimed,
    }));
    (byIgn.data || []).forEach((row) => {
      const p = row.nexus_players;
      if (!p) return;
      const existing = merged.get(p.nx_id) || {
        type: "player", id_code: p.nx_id, label: p.real_name || "", unclaimed: !p.claimed,
      };
      merged.set(p.nx_id, { ...existing, label: row.in_game_name || existing.label });
    });
    (byTo.data || []).forEach((t) => merged.set(t.to_id, {
      type: "to", id_code: t.to_id, label: t.organisation_name || t.to_ign || "", unclaimed: false,
    }));
    (byTeam.data || []).forEach((t) => merged.set(t.tm_id, {
      type: "team", id_code: t.tm_id, label: t.team_name || "", unclaimed: false,
    }));

    const results = Array.from(merged.values());
    if (results.length === 0) {
      setStatus("empty", q);
    } else {
      resultsEl.innerHTML = results.map(resultCard).join("");
      setStatus("results");
    }
  }

  searchInput.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    const q = searchInput.value.trim();
    if (q.length < 2) {
      setStatus("idle");
      resultsEl.innerHTML = "";
      return;
    }
    setStatus("loading");
    debounceTimer = setTimeout(() => runSearch(q), 300);
  });
</script>
</body></html>
