<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NexusID — TO Access</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Lexend+Deca:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
  body { font-family: 'Manrope', sans-serif; background-color: #F2EDE4; color: #1C1A14; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Oswald', sans-serif; }
  .font-mono { font-family: 'Lexend Deca', sans-serif; }
  input:focus { outline: none; }
  .input-focus-ring:focus-within { border-color: #A89880; box-shadow: 0 0 0 1px rgba(168, 152, 128, 0.25); }
  .btn-active:active { transform: scale(0.98); opacity: 0.9; }
</style></head>
<body>
<div class="w-full min-h-screen flex flex-col bg-[#F2EDE4]">
  <header class="shrink-0 pt-14 px-6 pb-8 bg-[#F2EDE4]">
    <div class="flex items-center gap-2 mb-10">
      <div class="w-8 h-8 bg-[#C85E0A] flex items-center justify-center rounded"><span class="text-white font-bold text-lg leading-none">N</span></div>
      <span class="font-display font-bold tracking-tighter text-xl uppercase italic text-[#0C0A07]">NexusID</span>
    </div>
    <div class="space-y-1">
      <h1 class="text-3xl font-display font-bold tracking-tight text-[#0C0A07]">TO Access</h1>
      <p class="text-sm text-[#6B6048] font-medium tracking-wide">Manage your tournament ledger</p>
    </div>
  </header>

  <main class="flex-1 px-6 py-4">
    <!-- Password login -->
    <form id="password-form" class="space-y-6">
      <div class="space-y-2">
        <label for="email" class="font-mono text-[10px] font-bold uppercase tracking-[0.2em] text-[#2C4A2E] ml-1">Email</label>
        <div class="relative flex items-center rounded-xl bg-[#E8E1D5] border border-[#C9BFA8]/60 input-focus-ring transition-all duration-200">
          <input type="email" id="email" required class="w-full bg-transparent py-4 px-4 text-sm text-[#1C1A14]" placeholder="you@example.com">
        </div>
      </div>
      <div class="space-y-2">
        <label for="password" class="font-mono text-[10px] font-bold uppercase tracking-[0.2em] text-[#2C4A2E] ml-1">Password</label>
        <div class="relative flex items-center rounded-xl bg-[#E8E1D5] border border-[#C9BFA8]/60 input-focus-ring transition-all duration-200">
          <input type="password" id="password" required class="w-full bg-transparent py-4 px-4 text-sm text-[#1C1A14]" placeholder="Enter password">
        </div>
      </div>

      <p id="password-error" class="text-[11px] text-[#B3261E] font-medium hidden"></p>

      <button type="submit" id="login-btn" class="font-mono w-full py-4 bg-[#2C4A2E] text-white font-bold uppercase tracking-[0.1em] text-sm rounded-xl transition-all btn-active mt-2">Login</button>

      <div class="flex flex-col items-center gap-6 mt-8">
        <button type="button" id="show-otp-btn" class="font-mono text-xs text-[#6B6048] hover:text-[#1C1A14] transition-colors">Login with OTP instead</button>
        <div class="w-full h-px bg-[#C9BFA8]/40 relative">
          <span class="font-mono absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-[#F2EDE4] px-4 text-[10px] uppercase tracking-widest text-[#4E7C2F]/70 font-bold">Identity Gateway</span>
        </div>
        <p class="text-xs text-[#6B6048]">Don't have an account? <a href="/to-signup.html" id="signup-link" class="text-[#0C0A07] font-bold hover:underline">Sign up as TO</a></p>
      </div>
    </form>

    <!-- OTP login (hidden by default) -->
    <form id="otp-form" class="space-y-6 hidden">
      <div class="space-y-2">
        <label for="otp-email" class="font-mono text-[10px] font-bold uppercase tracking-[0.2em] text-[#2C4A2E] ml-1">Email</label>
        <div class="relative flex items-center rounded-xl bg-[#E8E1D5] border border-[#C9BFA8]/60 input-focus-ring transition-all duration-200">
          <input type="email" id="otp-email" required class="w-full bg-transparent py-4 px-4 text-sm text-[#1C1A14]" placeholder="you@example.com">
        </div>
      </div>

      <button type="button" id="send-otp-btn" class="font-mono w-full py-4 bg-[#E8E1D5] border border-[#C9BFA8]/60 text-[#1C1A14] font-bold uppercase tracking-[0.1em] text-sm rounded-xl transition-all btn-active">Send Code</button>

      <div id="otp-code-section" class="space-y-2 hidden">
        <label for="otp-code" class="font-mono text-[10px] font-bold uppercase tracking-[0.2em] text-[#2C4A2E] ml-1">6-Digit Code</label>
        <div class="relative flex items-center rounded-xl bg-[#E8E1D5] border border-[#C9BFA8]/60 input-focus-ring transition-all duration-200">
          <input type="text" id="otp-code" inputmode="numeric" maxlength="6" class="w-full bg-transparent py-4 px-4 text-sm text-[#1C1A14] tracking-[0.3em]" placeholder="000000">
        </div>
        <button type="submit" id="verify-otp-btn" class="font-mono w-full py-4 bg-[#2C4A2E] text-white font-bold uppercase tracking-[0.1em] text-sm rounded-xl transition-all btn-active mt-4">Verify &amp; Log In</button>
      </div>

      <p id="otp-error" class="text-[11px] text-[#B3261E] font-medium hidden"></p>
      <p id="otp-info" class="text-[11px] text-[#4E7C2F] font-medium hidden"></p>

      <button type="button" id="show-password-btn" class="font-mono text-xs text-[#6B6048] hover:text-[#1C1A14] transition-colors block mx-auto">Login with password instead</button>
    </form>
  </main>

  <footer class="shrink-0 pb-[34px] px-6 pt-6 bg-[#F2EDE4] border-t border-[#C9BFA8]/50">
    <p class="font-mono text-[10px] text-[#6B6048]/50 uppercase tracking-[0.2em] font-medium text-center">Registry Infrastructure for Grassroots Esports</p>
  </footer>
</div>

<script type="module">
  import { signInTo, signInWithOtp, verifyOtp, getSession, fetchMyToProfile } from "/js/auth.js";

  const passwordForm = document.getElementById("password-form");
  const otpForm = document.getElementById("otp-form");
  const passwordError = document.getElementById("password-error");
  const otpError = document.getElementById("otp-error");
  const otpInfo = document.getElementById("otp-info");
  const otpCodeSection = document.getElementById("otp-code-section");

  // Already logged in? Route straight to the right place.
  getSession().then(async (session) => {
    if (!session) return;
    const profile = await fetchMyToProfile();
    window.location.href = profile ? "/to-dashboard.html" : "/to-onboarding.html";
  });

  async function afterLogin() {
    const profile = await fetchMyToProfile();
    window.location.href = profile ? "/to-dashboard.html" : "/to-onboarding.html";
  }

  document.getElementById("show-otp-btn").addEventListener("click", () => {
    passwordForm.classList.add("hidden");
    otpForm.classList.remove("hidden");
  });
  document.getElementById("show-password-btn").addEventListener("click", () => {
    otpForm.classList.add("hidden");
    passwordForm.classList.remove("hidden");
  });

  passwordForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    passwordError.classList.add("hidden");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    try {
      await signInTo(email, password);
      await afterLogin();
    } catch (err) {
      passwordError.textContent = err.message || "Login failed. Please try again.";
      passwordError.classList.remove("hidden");
    }
  });

  document.getElementById("send-otp-btn").addEventListener("click", async () => {
    otpError.classList.add("hidden");
    otpInfo.classList.add("hidden");
    const email = document.getElementById("otp-email").value.trim();
    if (!email) {
      otpError.textContent = "Enter your email first.";
      otpError.classList.remove("hidden");
      return;
    }
    try {
      await signInWithOtp(email);
      otpCodeSection.classList.remove("hidden");
      otpInfo.textContent = "Code sent — check your email.";
      otpInfo.classList.remove("hidden");
    } catch (err) {
      otpError.textContent = err.message || "Could not send code.";
      otpError.classList.remove("hidden");
    }
  });

  otpForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    otpError.classList.add("hidden");
    const email = document.getElementById("otp-email").value.trim();
    const code = document.getElementById("otp-code").value.trim();
    try {
      await verifyOtp(email, code);
      await afterLogin();
    } catch (err) {
      otpError.textContent = err.message || "Invalid or expired code.";
      otpError.classList.remove("hidden");
    }
  });
</script>
</body></html>
