<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NexusID — TO Access</title>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Lexend+Deca:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2EDE4;
    --bg-card: #EDE7DC;
    --border: #C9BFA8;
    --border-mid: #A89880;
    --forest: #2C4A2E;
    --forest-hover: #1A2E1B;
    --olive: #4E7C2F;
    --orange: #C85E0A;
    --orange-hover: #9E4908;
    --red: #9B1C11;
    --text-hero: #0C0A07;
    --text-body: #1C1A14;
    --text-label: #2C4A2E;
    --text-dim: #6B6048;
    --radius-sm: 2px;
    --radius-md: 3px;
    --radius-lg: 4px;
    --font-display: 'Oswald', sans-serif;
    --font-body: 'Manrope', sans-serif;
    --font-mono: 'Lexend Deca', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text-body); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  input:focus { outline: none; border-color: var(--forest) !important; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); background: var(--bg-card); cursor: pointer; transition: all .15s; }
  .tab.active { border-color: var(--orange); background: var(--orange); color: #fff; }
  .field-input { width: 100%; padding: 10px 12px; background: var(--bg); color: var(--text-body); border: 1px solid var(--border-mid); border-radius: var(--radius-md); font-family: var(--font-body); font-size: 13px; transition: border-color .2s; }
  .btn { font-family: var(--font-mono); letter-spacing: 1.2px; text-transform: uppercase; border: none; border-radius: var(--radius-md); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: all .15s; width: 100%; padding: 13px 16px; font-size: 10px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-forest { background: var(--forest); color: #fff; font-weight: 700; }
  .btn-forest:hover:not(:disabled) { background: var(--forest-hover); }
  .btn-primary { background: var(--orange); color: #fff; font-weight: 700; }
  .btn-primary:hover:not(:disabled) { background: var(--orange-hover); }
  .btn-secondary { background: var(--bg-card); color: var(--text-label); border: 1px solid var(--border-mid); font-weight: 600; }
  .btn-secondary:hover { border-color: var(--forest); color: var(--forest); }
  .link-btn { font-family: var(--font-mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); background: none; border: none; cursor: pointer; }
  .link-btn:hover { color: var(--text-body); }
  .field-label { font-family: var(--font-mono); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; color: var(--forest); }
  .msg-error { font-size: 11px; color: var(--red); font-weight: 500; margin: 0; }
  .msg-info { font-size: 11px; color: var(--olive); font-weight: 500; margin: 0; }
  [hidden] { display: none !important; }
</style></head>
<body>
<div style="width:100%;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text-body);font-family:var(--font-body);">

  <header style="flex-shrink:0;padding:clamp(24px,4vw,40px) clamp(20px,6vw,72px) 0;display:flex;justify-content:center;">
    <div style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:clamp(24px,3vw,32px);">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:30px;height:30px;background:var(--orange);display:flex;align-items:center;justify-content:center;border-radius:var(--radius-lg);flex-shrink:0;">
          <iconify-icon icon="lucide:fingerprint" style="color:#fff;font-size:16px;"></iconify-icon>
        </div>
        <span style="font-family:var(--font-display);font-weight:600;letter-spacing:2px;font-size:19px;text-transform:uppercase;"><span style="color:var(--forest);">Nexus</span><span style="color:var(--orange);">ID</span></span>
      </div>

      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <button type="button" id="tab-login" class="tab active">Login</button>
        <button type="button" id="tab-signup" class="tab">Sign Up</button>
      </div>

      <div style="display:flex;flex-direction:column;gap:4px;">
        <h1 id="page-title" style="font-family:var(--font-display);font-weight:700;letter-spacing:-0.01em;font-size:clamp(1.7rem,2vw + 1.3rem,2.2rem);color:var(--text-hero);margin:0;">TO Access</h1>
        <p id="page-subtitle" style="font-size:13px;color:var(--text-dim);font-weight:500;margin:0;">Manage your tournament ledger</p>
      </div>
    </div>
  </header>

  <main style="flex:1;padding:clamp(20px,3vw,28px) clamp(20px,6vw,72px) clamp(40px,5vw,56px);display:flex;justify-content:center;">
    <div style="width:100%;max-width:420px;">

      <!-- LOGIN: password method -->
      <form id="password-form" style="display:flex;flex-direction:column;gap:18px;">
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label class="field-label">Email</label>
          <input type="email" id="email" required class="field-input" placeholder="you@example.com">
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label class="field-label">Password</label>
          <input type="password" id="password" required class="field-input" placeholder="Enter password">
        </div>
        <p id="password-error" class="msg-error" hidden></p>
        <button type="submit" id="login-btn" class="btn btn-forest">Login</button>
        <div style="display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:6px;">
          <button type="button" id="show-otp-btn" class="link-btn">Login with OTP instead</button>
          <div style="width:100%;height:1px;background:var(--border);position:relative;">
            <span style="font-family:var(--font-mono);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg);padding:0 14px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.15em;color:var(--olive);">Identity Gateway</span>
          </div>
        </div>
      </form>

      <!-- LOGIN: OTP method -->
      <form id="otp-form" style="display:flex;flex-direction:column;gap:18px;" hidden>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label class="field-label">Email</label>
          <input type="email" id="otp-email" required class="field-input" placeholder="you@example.com">
        </div>
        <button type="button" id="send-otp-btn" class="btn btn-secondary">Send Code</button>

        <div id="otp-code-section" style="display:flex;flex-direction:column;gap:12px;" hidden>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <label class="field-label">6-Digit Code</label>
            <input type="text" id="otp-code" inputmode="numeric" maxlength="6" class="field-input" placeholder="000000">
          </div>
          <button type="submit" id="verify-otp-btn" class="btn btn-forest">Verify &amp; Log In</button>
        </div>

        <p id="otp-error" class="msg-error" hidden></p>
        <p id="otp-info" class="msg-info" hidden></p>
        <button type="button" id="show-password-btn" class="link-btn" style="margin:0 auto;">Login with password instead</button>
      </form>

      <!-- SIGN UP -->
      <form id="signup-form" style="display:flex;flex-direction:column;gap:18px;" hidden>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label class="field-label">Email</label>
          <input type="email" id="signup-email" required class="field-input" placeholder="you@example.com">
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label class="field-label">Password</label>
          <input type="password" id="signup-password" required minlength="6" class="field-input" placeholder="At least 6 characters">
        </div>
        <p id="signup-error" class="msg-error" hidden></p>
        <p id="signup-info" class="msg-info" hidden></p>
        <button type="submit" id="signup-btn" class="btn btn-primary">Create Account</button>
      </form>

    </div>
  </main>
</div>

<script type="module">
  import { signInTo, signInWithOtp, verifyOtp, signUpTo, getSession, fetchMyToProfile } from "/js/auth.js";

  const tabLogin = document.getElementById("tab-login");
  const tabSignup = document.getElementById("tab-signup");
  const pageTitle = document.getElementById("page-title");
  const pageSubtitle = document.getElementById("page-subtitle");

  const passwordForm = document.getElementById("password-form");
  const otpForm = document.getElementById("otp-form");
  const signupForm = document.getElementById("signup-form");

  function setMode(mode) {
    const isLogin = mode === "login";
    tabLogin.classList.toggle("active", isLogin);
    tabSignup.classList.toggle("active", !isLogin);
    pageTitle.textContent = isLogin ? "TO Access" : "Create TO Account";
    pageSubtitle.textContent = isLogin ? "Manage your tournament ledger" : "Register to run tournaments on NexusID";
    signupForm.hidden = isLogin;
    if (isLogin) {
      // Default back to the password method whenever returning to the login tab.
      passwordForm.hidden = false;
      otpForm.hidden = true;
    } else {
      passwordForm.hidden = true;
      otpForm.hidden = true;
    }
  }

  tabLogin.addEventListener("click", () => setMode("login"));
  tabSignup.addEventListener("click", () => setMode("signup"));

  // Already logged in? Route straight to the right place.
  getSession().then(async (session) => {
    if (!session) return;
    const profile = await fetchMyToProfile();
    window.location.href = profile ? "/to-dashboard.html" : "/to-onboarding.html";
  });

  async function afterLogin() {
    const profile = await fetchMyToProfile();
    window.location.href = profile ? "/to-dashboard.html" : "/to-onboarding.html";
  }

  document.getElementById("show-otp-btn").addEventListener("click", () => {
    passwordForm.hidden = true;
    otpForm.hidden = false;
  });
  document.getElementById("show-password-btn").addEventListener("click", () => {
    otpForm.hidden = true;
    passwordForm.hidden = false;
  });

  const passwordError = document.getElementById("password-error");
  passwordForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    passwordError.hidden = true;
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    try {
      await signInTo(email, password);
      await afterLogin();
    } catch (err) {
      passwordError.textContent = err.message || "Login failed. Please try again.";
      passwordError.hidden = false;
    }
  });

  const otpError = document.getElementById("otp-error");
  const otpInfo = document.getElementById("otp-info");
  const otpCodeSection = document.getElementById("otp-code-section");

  document.getElementById("send-otp-btn").addEventListener("click", async () => {
    otpError.hidden = true;
    otpInfo.hidden = true;
    const email = document.getElementById("otp-email").value.trim();
    if (!email) {
      otpError.textContent = "Enter your email first.";
      otpError.hidden = false;
      return;
    }
    try {
      await signInWithOtp(email);
      otpCodeSection.hidden = false;
      otpInfo.textContent = "Code sent — check your email.";
      otpInfo.hidden = false;
    } catch (err) {
      otpError.textContent = err.message || "Could not send code.";
      otpError.hidden = false;
    }
  });

  otpForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    otpError.hidden = true;
    const email = document.getElementById("otp-email").value.trim();
    const code = document.getElementById("otp-code").value.trim();
    try {
      await verifyOtp(email, code);
      await afterLogin();
    } catch (err) {
      otpError.textContent = err.message || "Invalid or expired code.";
      otpError.hidden = false;
    }
  });

  const signupError = document.getElementById("signup-error");
  const signupInfo = document.getElementById("signup-info");
  signupForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    signupError.hidden = true;
    signupInfo.hidden = true;
    const email = document.getElementById("signup-email").value.trim();
    const password = document.getElementById("signup-password").value;
    try {
      const data = await signUpTo(email, password);
      if (data.session) {
        window.location.href = "/to-onboarding.html";
      } else {
        signupInfo.textContent = "Account created. Check your email to confirm it, then log in.";
        signupInfo.hidden = false;
      }
    } catch (err) {
      signupError.textContent = err.message || "Something went wrong. Please try again.";
      signupError.hidden = false;
    }
  });
</script>
</body></html>
