<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NexusID — Set Password</title>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Lexend+Deca:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2EDE4;
    --bg-panel: #E8E1D5;
    --bg-card: #EDE7DC;
    --border: #C9BFA8;
    --border-mid: #A89880;
    --forest: #2C4A2E;
    --forest-hover: #1A2E1B;
    --olive: #4E7C2F;
    --orange: #C85E0A;
    --red: #9B1C11;
    --text-hero: #0C0A07;
    --text-body: #1C1A14;
    --text-dim: #6B6048;
    --radius-sm: 2px;
    --radius-md: 3px;
    --radius-lg: 4px;
    --font-display: 'Oswald', sans-serif;
    --font-body: 'Manrope', sans-serif;
    --font-mono: 'Lexend Deca', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text-body); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  input:focus { outline: none; border-color: var(--forest) !important; }
  .field-input { width: 100%; padding: 10px 12px; background: var(--bg); color: var(--text-body); border: 1px solid var(--border-mid); border-radius: var(--radius-md); font-family: var(--font-body); font-size: 13px; transition: border-color .2s; }
  .field-label { font-family: var(--font-mono); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; color: var(--forest); }
  .btn { font-family: var(--font-mono); letter-spacing: 1.2px; text-transform: uppercase; border: none; border-radius: var(--radius-md); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: all .15s; width: 100%; padding: 13px 16px; font-size: 10px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-forest { background: var(--forest); color: #fff; font-weight: 700; }
  .btn-forest:hover:not(:disabled) { background: var(--forest-hover); }
  .msg-error { font-size: 11px; color: var(--red); font-weight: 500; margin: 0; }
  .section-heading { font-family: var(--font-mono); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; color: var(--olive); margin: 0; }
  @keyframes modal-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg-ok { font-size: 12px; color: var(--olive); font-weight: 600; margin: 0; }
  .note { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin: 0; }
  [hidden] { display: none !important; }
</style></head>
<body>
<div style="width:100%;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text-body);font-family:var(--font-body);position:relative;">

  <header style="flex-shrink:0;padding:clamp(24px,4vw,40px) clamp(20px,6vw,72px) clamp(16px,2vw,20px);display:flex;justify-content:center;border-bottom:1px solid var(--border);">
    <div style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:clamp(20px,3vw,28px);">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:30px;height:30px;background:var(--orange);display:flex;align-items:center;justify-content:center;border-radius:var(--radius-lg);flex-shrink:0;">
          <iconify-icon icon="lucide:fingerprint" style="color:#fff;font-size:16px;"></iconify-icon>
        </div>
        <span style="font-family:var(--font-display);font-weight:600;letter-spacing:2px;font-size:19px;text-transform:uppercase;"><span style="color:var(--forest);">Nexus</span><span style="color:var(--orange);">ID</span></span>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;">
        <h1 style="font-family:var(--font-display);font-weight:700;letter-spacing:-0.01em;font-size:clamp(1.7rem,2vw + 1.3rem,2.2rem);color:var(--text-hero);margin:0;">Set Your Password</h1>
        <p style="font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.2em;color:var(--text-dim);margin:0;">Website Login</p>
      </div>
    </div>
  </header>

  <main style="flex:1;padding:clamp(24px,3vw,32px) clamp(20px,6vw,72px) clamp(40px,5vw,56px);display:flex;justify-content:center;">
    <div style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:24px;">

      <p id="status" class="note">Opening your link…</p>

      <div id="bad-link" hidden style="display:flex;flex-direction:column;gap:16px;">
        <p class="note">This link has expired or was already used. In the NexusID Telegram bot, tap <strong>Website login</strong> to get a new one.</p>
        <a href="/to-login.html" class="btn btn-forest" style="text-decoration:none;">Go to Login</a>
      </div>

      <form id="password-form" hidden style="display:flex;flex-direction:column;gap:16px;">
        <p id="login-hint" class="note"></p>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label class="field-label" for="password">New Password <span style="color:var(--red);">*</span></label>
          <input type="password" id="password" required minlength="8" autocomplete="new-password" class="field-input" placeholder="At least 8 characters">
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label class="field-label" for="password-confirm">Confirm Password <span style="color:var(--red);">*</span></label>
          <input type="password" id="password-confirm" required minlength="8" autocomplete="new-password" class="field-input">
        </div>
        <p id="password-error" class="msg-error" hidden></p>
        <button type="submit" id="password-btn" class="btn btn-forest">Save Password</button>
      </form>

      <div id="done" hidden style="display:flex;flex-direction:column;gap:16px;">
        <p class="msg-ok">Password saved. You can now log in on the website with your email and this password.</p>
        <a href="/to-dashboard.html" class="btn btn-forest" style="text-decoration:none;">Go to Dashboard</a>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { getSession, setPassword } from "/js/auth.js";

  (async () => {
    // The one-time link from the bot signs the browser in on arrival (the
    // Supabase client reads the token from the URL).
    const session = await getSession();
    document.getElementById("status").hidden = true;
    if (!session) {
      document.getElementById("bad-link").hidden = false;
      return;
    }
    document.getElementById("login-hint").textContent =
      `Choose a password for ${session.user.email}. That email is your website login.`;
    document.getElementById("password-form").hidden = false;
  })();

  document.getElementById("password-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("password-error");
    const btn = document.getElementById("password-btn");
    const password = document.getElementById("password").value;
    errorEl.hidden = true;
    if (password !== document.getElementById("password-confirm").value) {
      errorEl.textContent = "The two passwords don't match.";
      errorEl.hidden = false;
      return;
    }
    btn.disabled = true;
    try {
      await setPassword(password);
      document.getElementById("password-form").hidden = true;
      document.getElementById("done").hidden = false;
    } catch (err) {
      errorEl.textContent = err.message || "Couldn't save the password. Try again.";
      errorEl.hidden = false;
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body></html>
