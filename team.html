<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NexusID — Team</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Lexend+Deca:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
  body { font-family: 'Manrope', sans-serif; background-color: #F2EDE4; color: #1C1A14; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Oswald', sans-serif; }
  .font-mono { font-family: 'Lexend Deca', sans-serif; }
</style></head>
<body>
<div class="w-full min-h-screen flex flex-col bg-[#F2EDE4]">

  <header class="shrink-0 pt-14 px-6 pb-4 bg-[#F2EDE4]">
    <a href="/index.html" class="flex items-center gap-2 w-fit">
      <div class="w-8 h-8 bg-[#C85E0A] flex items-center justify-center rounded"><span class="text-white font-bold text-lg leading-none">N</span></div>
      <span class="font-display font-bold tracking-tighter text-xl uppercase italic text-[#0C0A07]">NexusID</span>
    </a>
  </header>

  <main id="content" class="flex-1 px-6 py-4">
    <p class="font-mono text-xs text-[#6B6048] uppercase tracking-widest">Loading…</p>
  </main>

  <footer class="shrink-0 pb-[34px] px-6 pt-6 bg-[#F2EDE4] border-t border-[#C9BFA8]/50">
    <p class="font-mono text-[10px] text-[#6B6048]/50 uppercase tracking-[0.2em] font-medium text-center">Registry Infrastructure for Grassroots Esports</p>
  </footer>
</div>

<script type="module">
  import { supabase } from "/js/supabase-config.js";

  const content = document.getElementById("content");
  const tmId = new URLSearchParams(window.location.search).get("id") || "";

  function notFound() {
    content.innerHTML = `
      <div class="pt-10 space-y-2">
        <h1 class="text-2xl font-display font-bold text-[#0C0A07]">Not Found</h1>
        <p class="text-sm text-[#6B6048]">No Nexus ID matches "${tmId}".</p>
        <a href="/search.html" class="inline-block mt-4 font-mono text-xs font-bold text-[#2C4A2E] uppercase tracking-widest">&larr; Back to search</a>
      </div>`;
  }

  async function render() {
    if (!tmId) { notFound(); return; }

    const { data: team, error } = await supabase
      .from("nexus_teams")
      .select("id, tm_id, team_name, created_at")
      .eq("tm_id", tmId)
      .maybeSingle();

    if (error || !team) { notFound(); return; }

    const { data: members } = await supabase
      .from("nexus_team_members")
      .select("joined_at, nexus_players(nx_id, real_name, claimed)")
      .eq("team_id", team.id)
      .is("left_at", null)
      .order("joined_at", { ascending: true });

    const rosterHtml = (members && members.length)
      ? members.map((m) => {
          const p = m.nexus_players;
          if (!p) return "";
          const unclaimed = p.claimed
            ? ""
            : `<span class="w-1.5 h-1.5 rounded-full bg-[#9B1C11] inline-block ml-1.5"></span>`;
          return `
        <a href="/player.html?id=${encodeURIComponent(p.nx_id)}" class="flex justify-between items-center py-3 border-b border-[#C9BFA8]/30 last:border-0">
          <div class="flex items-center">
            <p class="text-sm text-[#1C1A14] font-medium">${p.real_name || p.nx_id}</p>
            ${unclaimed}
          </div>
          <p class="font-mono text-[10px] text-[#6B6048]/70">${p.nx_id}</p>
        </a>`;
        }).join("")
      : `<p class="text-xs text-[#6B6048]">No active roster members.</p>`;

    content.innerHTML = `
      <div class="pt-4 pb-8 space-y-3">
        <div class="flex items-center justify-between">
          <h1 class="text-3xl font-display font-bold text-[#0C0A07] tracking-tight">${team.tm_id}</h1>
          <span class="font-mono text-[10px] font-bold uppercase tracking-widest px-2.5 py-1 rounded bg-[#C85E0A]/10 text-[#C85E0A] border border-[#C85E0A]/40">Team</span>
        </div>
        <p class="text-sm text-[#1C1A14]/80">${team.team_name}</p>
        <p class="font-mono text-[10px] text-[#6B6048]/60 uppercase tracking-widest">Registered ${new Date(team.created_at).toLocaleDateString()}</p>
      </div>

      <div class="space-y-3 pb-8">
        <p class="font-mono text-[10px] font-bold uppercase tracking-widest text-[#4E7C2F]/80">Roster</p>
        <div class="p-4 rounded-2xl bg-[#EDE7DC] border border-[#C9BFA8]/40">${rosterHtml}</div>
      </div>
    `;
  }

  render();
</script>
</body></html>
