<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NexusID — Register Player / Team</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Lexend+Deca:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
  body { font-family: 'Manrope', sans-serif; background-color: #F2EDE4; color: #1C1A14; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Oswald', sans-serif; }
  .font-mono { font-family: 'Lexend Deca', sans-serif; }
  input:focus, select:focus { outline: none; }
  .input-focus-ring:focus-within { border-color: #A89880; box-shadow: 0 0 0 1px rgba(168, 152, 128, 0.25); }
  .btn-active:active { transform: scale(0.98); opacity: 0.9; }
  .success-overlay { background: rgba(242, 237, 228, 0.95); backdrop-filter: blur(8px); }
</style></head>
<body>
<div class="w-full min-h-screen flex flex-col bg-[#F2EDE4] relative">
  <header class="shrink-0 pt-14 px-6 pb-4 bg-[#F2EDE4] border-b border-[#C9BFA8]/50">
    <div class="flex items-center gap-3 mb-4">
      <a href="/to-dashboard.html" class="w-8 h-8 flex items-center justify-center rounded-lg bg-[#E8E1D5] border border-[#C9BFA8]/60 text-[#6B6048]">&larr;</a>
      <div class="space-y-0.5">
        <h1 class="text-xl font-display font-bold text-[#0C0A07]">Register Player / Team</h1>
        <p class="font-mono text-[11px] text-[#6B6048] uppercase tracking-widest">Manual Identity Creation</p>
      </div>
    </div>
  </header>

  <main class="flex-1 px-6 py-6 space-y-10">

    <!-- Create Player -->
    <section class="space-y-4">
      <div class="flex items-center gap-2 mb-2">
        <h2 class="font-mono text-[10px] font-bold uppercase tracking-[0.2em] text-[#4E7C2F]/70">Create Nexus ID</h2>
        <div class="flex-1 h-px bg-[#C9BFA8]/40"></div>
      </div>
      <div class="p-4 rounded-xl bg-[#C85E0A]/8 border border-[#C85E0A]/25">
        <p class="text-xs text-[#6B6048] leading-relaxed">This creates an <span class="text-[#C85E0A] font-bold uppercase">Unclaimed</span> Nexus ID. The player must claim it via OTP later to verify their own stats.</p>
      </div>
      <form id="player-form" class="space-y-4">
        <div class="space-y-2">
          <label class="font-mono text-[10px] font-bold uppercase tracking-wider text-[#2C4A2E]">In-Game Name (IGN) <span class="text-[#B3261E]">*</span></label>
          <div class="relative flex items-center rounded-xl bg-[#E8E1D5] border border-[#C9BFA8]/60 input-focus-ring transition-all duration-200">
            <input type="text" id="p_ign" required class="w-full bg-transparent py-4 px-4 text-sm text-[#1C1A14]" placeholder="e.g. ProGamer92">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="space-y-2">
            <label class="font-mono text-[10px] font-bold uppercase tracking-wider text-[#2C4A2E]">Game <span class="text-[#B3261E]">*</span></label>
            <div class="relative flex items-center rounded-xl bg-[#E8E1D5] border border-[#C9BFA8]/60 input-focus-ring transition-all duration-200">
              <select id="p_game" required class="w-full bg-transparent py-4 px-4 text-sm text-[#1C1A14] appearance-none">
                <option value="" disabled selected>Select game</option>
                <option>BGMI</option>
                <option>Free Fire</option>
                <option>Valorant</option>
                <option>COD Mobile</option>
                <option>Other</option>
              </select>
            </div>
          </div>
          <div class="space-y-2">
            <label class="font-mono text-[10px] font-bold uppercase tracking-wider text-[#2C4A2E]">In-Game UID <span class="text-[#B3261E]">*</span></label>
            <div class="relative flex items-center rounded-xl bg-[#E8E1D5] border border-[#C9BFA8]/60 input-focus-ring transition-all duration-200">
              <input type="text" id="p_uid" required class="w-full bg-transparent py-4 px-4 text-sm text-[#1C1A14]" placeholder="UID">
            </div>
          </div>
        </div>
        <div class="space-y-2">
          <label class="font-mono text-[10px] font-bold uppercase tracking-wider text-[#2C4A2E]">Real Name <span class="text-[#6B6048]/60 normal-case tracking-normal font-medium">(Optional)</span></label>
          <div class="relative flex items-center rounded-xl bg-[#E8E1D5] border border-[#C9BFA8]/60 input-focus-ring transition-all duration-200">
            <input type="text" id="p_real_name" class="w-full bg-transparent py-4 px-4 text-sm text-[#1C1A14]" placeholder="Optional, for VOD verification">
          </div>
        </div>
        <p id="player-error" class="text-[11px] text-[#B3261E] font-medium hidden"></p>
        <button type="submit" id="player-submit" class="font-mono w-full py-4 bg-[#2C4A2E] text-white font-bold uppercase tracking-[0.2em] text-sm rounded-xl transition-all btn-active">Create Nexus ID</button>
      </form>
    </section>

    <!-- Create Team -->
    <section class="space-y-4 pb-8">
      <div class="flex items-center gap-2 mb-2">
        <h2 class="font-mono text-[10px] font-bold uppercase tracking-[0.2em] text-[#4E7C2F]/70">Create Team</h2>
        <div class="flex-1 h-px bg-[#C9BFA8]/40"></div>
      </div>
      <form id="team-form" class="space-y-4">
        <div class="space-y-2">
          <label class="font-mono text-[10px] font-bold uppercase tracking-wider text-[#2C4A2E]">Team Name <span class="text-[#B3261E]">*</span></label>
          <div class="relative flex items-center rounded-xl bg-[#E8E1D5] border border-[#C9BFA8]/60 input-focus-ring transition-all duration-200">
            <input type="text" id="t_name" required class="w-full bg-transparent py-4 px-4 text-sm text-[#1C1A14]" placeholder="e.g. Phoenix Esports">
          </div>
        </div>
        <p id="team-error" class="text-[11px] text-[#B3261E] font-medium hidden"></p>
        <button type="submit" id="team-submit" class="font-mono w-full py-4 bg-[#E8E1D5] border border-[#C9BFA8]/60 text-[#1C1A14] font-bold uppercase tracking-[0.2em] text-sm rounded-xl transition-all btn-active">Create Team</button>
      </form>
    </section>

  </main>
</div>

<div id="success-modal" class="hidden fixed inset-0 z-[100] success-overlay flex items-center justify-center p-6">
  <div class="w-full max-w-sm rounded-3xl border border-[#C9BFA8]/60 bg-[#E8E1D5] p-8 shadow-2xl space-y-6">
    <div class="w-16 h-16 rounded-full bg-[#4E7C2F]/10 border border-[#4E7C2F]/25 flex items-center justify-center mx-auto">
      <span class="text-[#4E7C2F] text-3xl">✓</span>
    </div>
    <div class="text-center space-y-2">
      <h3 id="success-title" class="text-xl font-display font-bold text-[#0C0A07]">Created</h3>
      <p id="success-subtitle" class="text-sm text-[#6B6048]"></p>
    </div>
    <div class="p-6 rounded-2xl bg-[#EDE7DC] border border-[#C9BFA8]/50 text-center space-y-3">
      <p id="success-label" class="font-mono text-[10px] font-bold uppercase tracking-[0.3em] text-[#4E7C2F]/70"></p>
      <p id="success-id" class="text-3xl font-display font-bold tracking-tighter text-[#0C0A07]"></p>
    </div>
    <div class="space-y-3 pt-2">
      <button id="success-close" class="font-mono block w-full py-4 bg-[#2C4A2E] text-white text-center font-bold uppercase tracking-widest text-xs rounded-xl">Register Another</button>
      <a href="/to-dashboard.html" class="font-mono block w-full py-4 bg-[#E8E1D5] border border-[#C9BFA8]/60 text-[#1C1A14] text-center font-bold uppercase tracking-widest text-xs rounded-xl">Back to Dashboard</a>
    </div>
  </div>
</div>

<script type="module">
  import { requireSession, fetchMyToProfile, createPlayer, createTeam } from "/js/auth.js";

  (async () => {
    const session = await requireSession();
    if (!session) return;
    const profile = await fetchMyToProfile();
    if (!profile) window.location.href = "/to-onboarding.html";
  })();

  const successModal = document.getElementById("success-modal");
  const successTitle = document.getElementById("success-title");
  const successSubtitle = document.getElementById("success-subtitle");
  const successLabel = document.getElementById("success-label");
  const successId = document.getElementById("success-id");

  function showSuccess({ title, subtitle, label, id }) {
    successTitle.textContent = title;
    successSubtitle.textContent = subtitle;
    successLabel.textContent = label;
    successId.textContent = id;
    successModal.classList.remove("hidden");
  }
  document.getElementById("success-close").addEventListener("click", () => {
    successModal.classList.add("hidden");
  });

  const playerForm = document.getElementById("player-form");
  const playerError = document.getElementById("player-error");
  const playerSubmit = document.getElementById("player-submit");

  playerForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    playerError.classList.add("hidden");
    playerSubmit.disabled = true;
    try {
      const created = await createPlayer({
        real_name: document.getElementById("p_real_name").value.trim(),
        game: document.getElementById("p_game").value,
        in_game_uid: document.getElementById("p_uid").value.trim(),
        in_game_name: document.getElementById("p_ign").value.trim(),
      });
      playerForm.reset();
      showSuccess({
        title: "Player Registered",
        subtitle: "Registry identity successfully generated",
        label: "Generated Nexus ID",
        id: created.nx_id,
      });
    } catch (err) {
      playerError.textContent = err.message || "Could not create player. Please try again.";
      playerError.classList.remove("hidden");
    } finally {
      playerSubmit.disabled = false;
    }
  });

  const teamForm = document.getElementById("team-form");
  const teamError = document.getElementById("team-error");
  const teamSubmit = document.getElementById("team-submit");

  teamForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    teamError.classList.add("hidden");
    teamSubmit.disabled = true;
    try {
      const created = await createTeam({ team_name: document.getElementById("t_name").value.trim() });
      teamForm.reset();
      showSuccess({
        title: "Team Created",
        subtitle: "Team registered in the ledger",
        label: "Generated Team ID",
        id: created.tm_id,
      });
    } catch (err) {
      teamError.textContent = err.message || "Could not create team. Please try again.";
      teamError.classList.remove("hidden");
    } finally {
      teamSubmit.disabled = false;
    }
  });
</script>
</body></html>
