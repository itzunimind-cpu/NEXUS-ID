<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NexusID — TO Sign Up</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Lexend+Deca:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
  body { font-family: 'Manrope', sans-serif; background-color: #F2EDE4; color: #1C1A14; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Oswald', sans-serif; }
  .font-mono { font-family: 'Lexend Deca', sans-serif; }
  input:focus { outline: none; }
  .input-focus-ring:focus-within { border-color: #A89880; box-shadow: 0 0 0 1px rgba(168, 152, 128, 0.25); }
  .error-ring { border-color: #B3261E !important; }
  .btn-active:active { transform: scale(0.98); opacity: 0.9; }
</style></head>
<body>
<div class="w-full min-h-screen flex flex-col bg-[#F2EDE4]">
  <header class="shrink-0 pt-14 px-6 pb-8 bg-[#F2EDE4]">
    <div class="flex items-center gap-2 mb-10">
      <div class="w-8 h-8 bg-[#C85E0A] flex items-center justify-center rounded"><span class="text-white font-bold text-lg leading-none">N</span></div>
      <span class="font-display font-bold tracking-tighter text-xl uppercase italic text-[#0C0A07]">NexusID</span>
    </div>
    <div class="space-y-1">
      <h1 class="text-3xl font-display font-bold tracking-tight text-[#0C0A07]">Create TO Account</h1>
      <p class="text-sm text-[#6B6048] font-medium tracking-wide">Register to run tournaments on NexusID</p>
    </div>
  </header>

  <main class="flex-1 px-6 py-4">
    <form id="signup-form" class="space-y-6">
      <div class="space-y-2">
        <label for="email" class="font-mono text-[10px] font-bold uppercase tracking-[0.2em] text-[#2C4A2E] ml-1">Email</label>
        <div class="relative flex items-center rounded-xl bg-[#E8E1D5] border border-[#C9BFA8]/60 input-focus-ring transition-all duration-200">
          <input type="email" id="email" required class="w-full bg-transparent py-4 px-4 text-sm text-[#1C1A14]" placeholder="you@example.com">
        </div>
      </div>
      <div class="space-y-2">
        <label for="password" class="font-mono text-[10px] font-bold uppercase tracking-[0.2em] text-[#2C4A2E] ml-1">Password</label>
        <div class="relative flex items-center rounded-xl bg-[#E8E1D5] border border-[#C9BFA8]/60 input-focus-ring transition-all duration-200">
          <input type="password" id="password" required minlength="6" class="w-full bg-transparent py-4 px-4 text-sm text-[#1C1A14]" placeholder="At least 6 characters">
        </div>
      </div>

      <p id="form-error" class="text-[11px] text-[#B3261E] font-medium hidden"></p>
      <p id="form-info" class="text-[11px] text-[#4E7C2F] font-medium hidden"></p>

      <button type="submit" id="signup-btn" class="font-mono w-full py-4 bg-[#2C4A2E] text-white font-bold uppercase tracking-[0.1em] text-sm rounded-xl transition-all btn-active mt-2">Create Account</button>

      <p class="text-xs text-[#6B6048] text-center">Already have an account? <a href="/to-login.html" class="text-[#0C0A07] font-bold hover:underline">Log in</a></p>
    </form>
  </main>

  <footer class="shrink-0 pb-[34px] px-6 pt-6 bg-[#F2EDE4] border-t border-[#C9BFA8]/50">
    <p class="font-mono text-[10px] text-[#6B6048]/50 uppercase tracking-[0.2em] font-medium text-center">Registry Infrastructure for Grassroots Esports</p>
  </footer>
</div>

<script type="module">
  import { signUpTo, getSession } from "/js/auth.js";

  const form = document.getElementById("signup-form");
  const errorEl = document.getElementById("form-error");
  const infoEl = document.getElementById("form-info");
  const submitBtn = document.getElementById("signup-btn");

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.remove("hidden");
    infoEl.classList.add("hidden");
  }
  function showInfo(msg) {
    infoEl.textContent = msg;
    infoEl.classList.remove("hidden");
    errorEl.classList.add("hidden");
  }

  // Already logged in? Skip straight past signup.
  getSession().then((session) => {
    if (session) window.location.href = "/to-onboarding.html";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.classList.add("hidden");
    infoEl.classList.add("hidden");
    submitBtn.disabled = true;

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const data = await signUpTo(email, password);
      if (data.session) {
        window.location.href = "/to-onboarding.html";
      } else {
        showInfo("Account created. Check your email to confirm it, then log in.");
      }
    } catch (err) {
      showError(err.message || "Something went wrong. Please try again.");
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body></html>
