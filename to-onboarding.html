<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NexusID — Complete TO Registration</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Lexend+Deca:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
  body { font-family: 'Manrope', sans-serif; background-color: #F2EDE4; color: #1C1A14; -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Oswald', sans-serif; }
  .font-mono { font-family: 'Lexend Deca', sans-serif; }
  input:focus { outline: none; }
  .input-focus-ring:focus-within { border-color: #A89880; box-shadow: 0 0 0 1px rgba(168, 152, 128, 0.25); }
  .error-ring { border-color: #B3261E !important; }
  .btn-active:active { transform: scale(0.98); opacity: 0.9; }
  .success-overlay { background: rgba(242, 237, 228, 0.95); backdrop-filter: blur(8px); }
</style></head>
<body>
<div class="w-full min-h-screen flex flex-col bg-[#F2EDE4] relative">
  <header class="shrink-0 pt-14 px-6 pb-4 bg-[#F2EDE4] border-b border-[#C9BFA8]/50">
    <div class="space-y-0.5">
      <h1 class="text-xl font-display font-bold text-[#0C0A07]">Complete TO Registration</h1>
      <p class="font-mono text-[11px] text-[#6B6048] uppercase tracking-widest">One-time setup</p>
    </div>
  </header>

  <main class="flex-1 px-6 py-6 space-y-8">
    <div class="p-4 rounded-xl bg-[#C85E0A]/8 border border-[#C85E0A]/25 flex gap-3">
      <p class="text-xs text-[#6B6048] leading-relaxed">This generates your permanent <span class="text-[#C85E0A] font-bold uppercase">TO-</span> id. Your email is already on file from your account login — no need to re-enter it.</p>
    </div>

    <form id="onboarding-form" class="space-y-8">
      <section class="space-y-4">
        <div class="flex items-center gap-2 mb-2">
          <h2 class="font-mono text-[10px] font-bold uppercase tracking-[0.2em] text-[#4E7C2F]/70">Organiser Information</h2>
          <div class="flex-1 h-px bg-[#C9BFA8]/40"></div>
        </div>
        <div class="space-y-2">
          <label class="font-mono text-[10px] font-bold uppercase tracking-wider text-[#2C4A2E]">Your In-Game Name <span class="text-[#B3261E]">*</span></label>
          <div class="relative flex items-center rounded-xl bg-[#E8E1D5] border border-[#C9BFA8]/60 input-focus-ring transition-all duration-200">
            <input type="text" id="to_ign" required class="w-full bg-transparent py-4 px-4 text-sm text-[#1C1A14]" placeholder="e.g. OrganizedChaos">
          </div>
        </div>
        <div class="space-y-2">
          <label class="font-mono text-[10px] font-bold uppercase tracking-wider text-[#2C4A2E]">Your In-Game UID <span class="text-[#B3261E]">*</span></label>
          <div class="relative flex items-center rounded-xl bg-[#E8E1D5] border border-[#C9BFA8]/60 input-focus-ring transition-all duration-200">
            <input type="text" id="to_uid" required class="w-full bg-transparent py-4 px-4 text-sm text-[#1C1A14]" placeholder="Your game account UID">
          </div>
        </div>
        <div class="space-y-2">
          <label class="font-mono text-[10px] font-bold uppercase tracking-wider text-[#2C4A2E]">Real Name <span class="text-[#6B6048]/60 normal-case tracking-normal font-medium">(Optional)</span></label>
          <div class="relative flex items-center rounded-xl bg-[#E8E1D5] border border-[#C9BFA8]/60 input-focus-ring transition-all duration-200">
            <input type="text" id="to_real_name" class="w-full bg-transparent py-4 px-4 text-sm text-[#1C1A14]" placeholder="Optional">
          </div>
        </div>
      </section>

      <section class="space-y-4">
        <div class="flex items-center gap-2 mb-2">
          <h2 class="font-mono text-[10px] font-bold uppercase tracking-[0.2em] text-[#4E7C2F]/70">Organisation</h2>
          <div class="flex-1 h-px bg-[#C9BFA8]/40"></div>
        </div>
        <div class="space-y-2">
          <label class="font-mono text-[10px] font-bold uppercase tracking-wider text-[#2C4A2E]">Organisation Name <span class="text-[#B3261E]">*</span></label>
          <div class="relative flex items-center rounded-xl bg-[#E8E1D5] border border-[#C9BFA8]/60 input-focus-ring transition-all duration-200">
            <input type="text" id="organisation_name" required class="w-full bg-transparent py-4 px-4 text-sm text-[#1C1A14]" placeholder="e.g. ProLeague India">
          </div>
        </div>
      </section>

      <p id="form-error" class="text-[11px] text-[#B3261E] font-medium hidden"></p>

      <button type="submit" id="submit-btn" class="font-mono w-full py-4 bg-[#2C4A2E] text-white font-bold uppercase tracking-[0.2em] text-sm rounded-xl transition-all btn-active">Create TO Account</button>
    </form>
  </main>
</div>

<div id="success-modal" class="hidden fixed inset-0 z-[100] success-overlay flex items-center justify-center p-6">
  <div class="w-full max-w-sm rounded-3xl border border-[#C9BFA8]/60 bg-[#E8E1D5] p-8 shadow-2xl space-y-6">
    <div class="w-16 h-16 rounded-full bg-[#4E7C2F]/10 border border-[#4E7C2F]/25 flex items-center justify-center mx-auto">
      <span class="text-[#4E7C2F] text-3xl">✓</span>
    </div>
    <div class="text-center space-y-2">
      <h3 class="text-xl font-display font-bold text-[#0C0A07]">TO Registered</h3>
      <p class="text-sm text-[#6B6048]">Your organiser identity has been created</p>
    </div>
    <div class="p-6 rounded-2xl bg-[#EDE7DC] border border-[#C9BFA8]/50 text-center space-y-3">
      <p class="font-mono text-[10px] font-bold uppercase tracking-[0.3em] text-[#4E7C2F]/70">Your TO ID</p>
      <p id="generated-to-id" class="text-3xl font-display font-bold tracking-tighter text-[#0C0A07]"></p>
    </div>
    <a href="/to-dashboard.html" class="font-mono block w-full py-4 bg-[#2C4A2E] text-white text-center font-bold uppercase tracking-widest text-xs rounded-xl">Go to Dashboard</a>
  </div>
</div>

<script type="module">
  import { requireSession, fetchMyToProfile, createToProfile } from "/js/auth.js";

  (async () => {
    const session = await requireSession();
    if (!session) return; // requireSession already redirected to login
    const existing = await fetchMyToProfile();
    if (existing) {
      window.location.href = "/to-dashboard.html";
    }
  })();

  const form = document.getElementById("onboarding-form");
  const errorEl = document.getElementById("form-error");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.classList.add("hidden");
    submitBtn.disabled = true;

    const payload = {
      to_ign: document.getElementById("to_ign").value.trim(),
      to_uid: document.getElementById("to_uid").value.trim(),
      to_real_name: document.getElementById("to_real_name").value.trim(),
      organisation_name: document.getElementById("organisation_name").value.trim(),
    };

    try {
      const created = await createToProfile(payload);
      document.getElementById("generated-to-id").textContent = created.to_id;
      document.getElementById("success-modal").classList.remove("hidden");
    } catch (err) {
      errorEl.textContent = err.message || "Could not complete registration. Please try again.";
      errorEl.classList.remove("hidden");
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body></html>
