<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NexusID — Complete TO Registration</title>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Lexend+Deca:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2EDE4;
    --bg-panel: #E8E1D5;
    --bg-card: #EDE7DC;
    --border: #C9BFA8;
    --border-mid: #A89880;
    --forest: #2C4A2E;
    --forest-hover: #1A2E1B;
    --olive: #4E7C2F;
    --orange: #C85E0A;
    --red: #9B1C11;
    --text-hero: #0C0A07;
    --text-body: #1C1A14;
    --text-dim: #6B6048;
    --radius-sm: 2px;
    --radius-md: 3px;
    --radius-lg: 4px;
    --font-display: 'Oswald', sans-serif;
    --font-body: 'Manrope', sans-serif;
    --font-mono: 'Lexend Deca', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text-body); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  input:focus { outline: none; border-color: var(--forest) !important; }
  .field-input { width: 100%; padding: 10px 12px; background: var(--bg); color: var(--text-body); border: 1px solid var(--border-mid); border-radius: var(--radius-md); font-family: var(--font-body); font-size: 13px; transition: border-color .2s; }
  .field-label { font-family: var(--font-mono); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; color: var(--forest); }
  .btn { font-family: var(--font-mono); letter-spacing: 1.2px; text-transform: uppercase; border: none; border-radius: var(--radius-md); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; transition: all .15s; width: 100%; padding: 13px 16px; font-size: 10px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-forest { background: var(--forest); color: #fff; font-weight: 700; }
  .btn-forest:hover:not(:disabled) { background: var(--forest-hover); }
  .msg-error { font-size: 11px; color: var(--red); font-weight: 500; margin: 0; }
  .section-heading { font-family: var(--font-mono); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; color: var(--olive); margin: 0; }
  @keyframes modal-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  [hidden] { display: none !important; }
</style></head>
<body>
<div style="width:100%;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text-body);font-family:var(--font-body);position:relative;">

  <header style="flex-shrink:0;padding:clamp(24px,4vw,40px) clamp(20px,6vw,72px) clamp(16px,2vw,20px);display:flex;justify-content:center;border-bottom:1px solid var(--border);">
    <div style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:clamp(20px,3vw,28px);">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:30px;height:30px;background:var(--orange);display:flex;align-items:center;justify-content:center;border-radius:var(--radius-lg);flex-shrink:0;">
          <iconify-icon icon="lucide:fingerprint" style="color:#fff;font-size:16px;"></iconify-icon>
        </div>
        <span style="font-family:var(--font-display);font-weight:600;letter-spacing:2px;font-size:19px;text-transform:uppercase;"><span style="color:var(--forest);">Nexus</span><span style="color:var(--orange);">ID</span></span>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;">
        <h1 style="font-family:var(--font-display);font-weight:700;letter-spacing:-0.01em;font-size:clamp(1.7rem,2vw + 1.3rem,2.2rem);color:var(--text-hero);margin:0;">Complete TO Registration</h1>
        <p style="font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.2em;color:var(--text-dim);margin:0;">One-Time Setup</p>
      </div>
    </div>
  </header>

  <main style="flex:1;padding:clamp(24px,3vw,32px) clamp(20px,6vw,72px) clamp(40px,5vw,56px);display:flex;justify-content:center;">
    <div style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:28px;">

      <div style="padding:14px 16px;border-radius:var(--radius-md);background:rgba(200,94,10,.08);border:1px solid rgba(200,94,10,.25);display:flex;gap:10px;">
        <iconify-icon icon="lucide:info" style="color:var(--orange);font-size:15px;flex-shrink:0;margin-top:1px;"></iconify-icon>
        <p style="font-size:12px;color:var(--text-dim);line-height:1.5;margin:0;">This generates your permanent <span style="color:var(--orange);font-weight:700;text-transform:uppercase;">TO-</span> id. Your email is already on file from your account login. No need to re-enter it.</p>
      </div>

      <form id="onboarding-form" style="display:flex;flex-direction:column;gap:28px;">

        <section style="display:flex;flex-direction:column;gap:16px;">
          <div style="display:flex;align-items:center;gap:10px;">
            <h2 class="section-heading">Organiser Information</h2>
            <div style="flex:1;height:1px;background:var(--border);"></div>
          </div>

          <div style="display:flex;flex-direction:column;gap:6px;">
            <label class="field-label">Your In-Game Name <span style="color:var(--red);">*</span></label>
            <input type="text" id="to_ign" required class="field-input" placeholder="e.g. OrganizedChaos">
          </div>

          <div style="display:flex;flex-direction:column;gap:6px;">
            <label class="field-label">Your In-Game UID <span style="color:var(--red);">*</span></label>
            <input type="text" id="to_uid" required class="field-input" placeholder="Your game account UID">
          </div>

          <div style="display:flex;flex-direction:column;gap:6px;">
            <label class="field-label">Real Name <span style="font-family:var(--font-body);font-size:11px;font-weight:500;text-transform:none;letter-spacing:normal;color:var(--text-dim);">(Optional)</span></label>
            <input type="text" id="to_real_name" class="field-input" placeholder="Optional">
          </div>
        </section>

        <section style="display:flex;flex-direction:column;gap:16px;">
          <div style="display:flex;align-items:center;gap:10px;">
            <h2 class="section-heading">Organisation</h2>
            <div style="flex:1;height:1px;background:var(--border);"></div>
          </div>

          <div style="display:flex;flex-direction:column;gap:6px;">
            <label class="field-label">Organisation Name <span style="color:var(--red);">*</span></label>
            <input type="text" id="organisation_name" required class="field-input" placeholder="e.g. ProLeague India">
          </div>
        </section>

        <p id="form-error" class="msg-error" hidden></p>
        <button type="submit" id="submit-btn" class="btn btn-forest">Create TO Account</button>
      </form>

    </div>
  </main>

  <div id="success-modal" hidden style="position:fixed;inset:0;z-index:100;background:rgba(242,237,228,.95);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;">
    <div style="width:100%;max-width:380px;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--bg-card);padding:32px;box-shadow:0 4px 16px rgba(13,13,13,.08);display:flex;flex-direction:column;gap:24px;animation:modal-in .2s ease;">
      <div style="width:56px;height:56px;border-radius:var(--radius-lg);background:rgba(78,124,47,.12);border:1px solid rgba(78,124,47,.3);display:flex;align-items:center;justify-content:center;margin:0 auto;">
        <span style="color:var(--olive);font-size:26px;line-height:1;">✓</span>
      </div>
      <div style="text-align:center;display:flex;flex-direction:column;gap:6px;">
        <h3 style="font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--text-hero);margin:0;">TO Registered</h3>
        <p style="font-size:13px;color:var(--text-dim);margin:0;">Your organiser identity has been created</p>
      </div>
      <div style="padding:20px;border-radius:var(--radius-md);background:var(--bg-panel);border:1px solid var(--border);text-align:center;display:flex;flex-direction:column;gap:10px;">
        <p style="font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.25em;color:var(--olive);margin:0;">Your TO ID</p>
        <p id="generated-to-id" style="font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-0.02em;color:var(--text-hero);margin:0;"></p>
      </div>
      <a href="/to-dashboard.html" class="btn btn-forest" style="text-decoration:none;">Go to Dashboard</a>
    </div>
  </div>

</div>

<script type="module">
  import { requireSession, fetchMyToProfile, createToProfile } from "/js/auth.js";

  (async () => {
    const session = await requireSession();
    if (!session) return; // requireSession already redirected to login
    const existing = await fetchMyToProfile();
    if (existing) {
      window.location.href = "/to-dashboard.html";
    }
  })();

  const form = document.getElementById("onboarding-form");
  const errorEl = document.getElementById("form-error");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.hidden = true;
    submitBtn.disabled = true;
    submitBtn.textContent = "Creating…";

    const payload = {
      to_ign: document.getElementById("to_ign").value.trim(),
      to_uid: document.getElementById("to_uid").value.trim(),
      to_real_name: document.getElementById("to_real_name").value.trim(),
      organisation_name: document.getElementById("organisation_name").value.trim(),
    };

    try {
      const created = await createToProfile(payload);
      document.getElementById("generated-to-id").textContent = created.to_id;
      document.getElementById("success-modal").hidden = false;
    } catch (err) {
      errorEl.textContent = err.message || "Could not complete registration. Please try again.";
      errorEl.hidden = false;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Create TO Account";
    }
  });
</script>
</body></html>
